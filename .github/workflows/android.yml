name: Android private testing (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-private-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OIRAM_TOOLS_DIR: ${{ github.workspace }}/.deps
      ANDROID_HOME: ${{ github.workspace }}/.deps/android-sdk
      JOBS: "3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.12"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21.0.8+9"
      - name: Install pinned toolchain
        run: ./scripts/setup-android.sh
      - name: Build and inspect private testing APK
        run: ./scripts/build-apk.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event.repository.private == true
        with:
          name: oiram-arm64-private-testing
          path: build/oiram-arm64-debug.apk
          retention-days: 7
          if-no-files-found: error
      - name: Keep testing APK private on public repositories
        if: github.event.repository.private != true
        run: echo 'APK upload skipped because this repository is public. Use a local build or a private fork for private testing downloads.'
